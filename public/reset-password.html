<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - TicketHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body class="bg-dark text-white d-flex align-items-center justify-content-center min-vh-100">

<div class="container" style="max-width: 440px;">
    <div class="card bg-black border-secondary p-4 shadow-lg rounded-4">
        <div class="card-body">
            <h3 class="text-center fw-bold text-danger mb-2">TicketHub</h3>
            <h5 class="text-center text-white mb-4">Set New Password</h5>

            <div id="alert-container"></div>

            <form id="reset-password-form">
                <input type="hidden" id="reset-token">

                <div class="mb-3">
                    <label class="form-label text-light">New Password</label>
                    <input type="password" id="new-password" class="form-control" minlength="8" required placeholder="Minimum 8 characters">
                    <div class="form-text text-muted" style="font-size: 11px;">Must be at least 8 characters long.</div>
                </div>

                <div class="mb-4">
                    <label class="form-label text-light">Confirm New Password</label>
                    <input type="password" id="confirm-password" class="form-control" minlength="8" required placeholder="Re-enter new password">
                </div>

                <button type="submit" class="btn btn-danger w-100 py-2 fw-bold" id="submit-btn">Reset Password</button>
            </form>

            <div class="text-center mt-4">
                <a href="index.html" class="text-secondary text-decoration-none small">Return to Sign In</a>
            </div>
        </div>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    const tokenInput = document.getElementById('reset-token');
    const alertContainer = document.getElementById('alert-container');
    const form = document.getElementById('reset-password-form');
    const submitBtn = document.getElementById('submit-btn');

    if (token) {
        tokenInput.value = token;
    } else {
        alertContainer.innerHTML = '<div class="alert alert-danger py-2">Invalid or missing reset token.</div>';
        form.classList.add('d-none');
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const newPassword = document.getElementById('new-password').value;
        const confirmPassword = document.getElementById('confirm-password').value;

        if (newPassword !== confirmPassword) {
            alertContainer.innerHTML = '<div class="alert alert-warning py-2">Passwords do not match.</div>';
            return;
        }

        submitBtn.disabled = true;
        submitBtn.innerText = 'Updating...';

        try {
            const res = await fetch('/api/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: tokenInput.value, newPassword })
            });

            const data = await res.json();
            if (data.success) {
                alertContainer.innerHTML = `<div class="alert alert-success py-2">${data.message}</div>`;
                form.classList.add('d-none');
                setTimeout(() => { window.location.href = 'index.html'; }, 2000);
            } else {
                alertContainer.innerHTML = `<div class="alert alert-danger py-2">${data.message || 'Error resetting password.'}</div>`;
                submitBtn.disabled = false;
                submitBtn.innerText = 'Reset Password';
            }
        } catch (err) {
            alertContainer.innerHTML = '<div class="alert alert-danger py-2">Server connection error. Please try again.</div>';
            submitBtn.disabled = false;
            submitBtn.innerText = 'Reset Password';
        }
    });
</script>
</body>
</html>
